services:
  postgres:
    image: postgres:16-alpine
    container_name: eureka_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eureka_master}
      POSTGRES_USER: ${POSTGRES_USER:-eureka_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eureka_secure_2026}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - eureka_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eureka_user} -d ${POSTGRES_DB:-eureka_master}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - eureka_net
    profiles:
      - core
      - db
      - full

  neo4j:
    image: neo4j:5.26-community
    container_name: eureka_neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-eureka_graph_2026}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_pagecache_size: 512M
      NEO4J_dbms_memory_heap_initial__size: 512M
      NEO4J_dbms_memory_heap_max__size: 1G
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - eureka_neo4j_data:/data
      - eureka_neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - eureka_net
    profiles:
      - core
      - db
      - full

  redis:
    image: redis:7-alpine
    container_name: eureka_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-eureka_redis_secret}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - eureka_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-eureka_redis_secret}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - eureka_net
    profiles:
      - core
      - db
      - full

  tritonserver:
    image: nvcr.io/nvidia/tritonserver:23.10-py3
    container_name: eureka_triton
    restart: unless-stopped
    command: tritonserver --model-repository=/models --strict-model-config=false --log-verbose=0
    ports:
      - "8001:8001"   # gRPC endpoint
      - "8002:8000"   # HTTP inference endpoint (mapped to host 8002 to avoid collision with api:8000)
      - "8003:8002"   # Metrics endpoint (Prometheus)
    volumes:
      - ./src/eureka/model_repository:/models
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/v2/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - eureka_net
    shm_size: '2gb'
    profiles:
      - inference
      - full

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eureka_api
    restart: unless-stopped
    command: uvicorn eureka.api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - ENVIRONMENT=production
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-eureka_master}
      - POSTGRES_USER=${POSTGRES_USER:-eureka_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-eureka_secure_2026}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-eureka_graph_2026}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-eureka_redis_secret}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-eureka_redis_secret}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-eureka_redis_secret}@redis:6379/1
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dgipr_maha_command_center_secret_2026_key}
      - TRITON_SERVER_URL=tritonserver:8001
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
      tritonserver:
        condition: service_started
        required: false
    networks:
      - eureka_net
    profiles:
      - app
      - full

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eureka_celery_worker
    restart: unless-stopped
    command: celery -A eureka.core.celery_app.celery_app worker --loglevel=info -c 4 -Q default,quad_ingestion,irf_binding,processor,outbox
    environment:
      - ENVIRONMENT=production
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-eureka_master}
      - POSTGRES_USER=${POSTGRES_USER:-eureka_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-eureka_secure_2026}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-eureka_graph_2026}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-eureka_redis_secret}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-eureka_redis_secret}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-eureka_redis_secret}@redis:6379/1
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dgipr_maha_command_center_secret_2026_key}
      - TRITON_SERVER_URL=tritonserver:8001
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
      tritonserver:
        condition: service_started
        required: false
    networks:
      - eureka_net
    profiles:
      - worker
      - full


  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eureka_celery_beat
    restart: unless-stopped
    command: celery -A eureka.core.celery_app.celery_app beat --loglevel=info
    environment:
      - ENVIRONMENT=production
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-eureka_master}
      - POSTGRES_USER=${POSTGRES_USER:-eureka_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-eureka_secure_2026}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-eureka_graph_2026}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-eureka_redis_secret}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-eureka_redis_secret}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-eureka_redis_secret}@redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - eureka_net
    profiles:
      - worker
      - full

volumes:
  eureka_pgdata:
  eureka_neo4j_data:
  eureka_neo4j_logs:
  eureka_redis_data:

networks:
  eureka_net:
    driver: bridge
