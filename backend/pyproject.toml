[project]
name = "eureka-backend"
version = "1.0.0"
description = "The DGIPR Maha-Command Center Media Intelligence Engine"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.28",
    "asyncpg>=0.29.0",
    "greenlet>=3.0.0",
    "psycopg2-binary>=2.9.9",
    "psycopg[binary]>=3.1.18",
    "alembic>=1.13.1",
    "neo4j>=5.18.0",
    "redis>=5.0.3",
    "celery[redis]>=5.3.6",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "groq>=0.9.0",
    "openai>=1.12.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "webauthn>=2.0.0",
    "tenacity>=8.2.3",
    "numpy>=1.26.4",
    "pandas>=2.0.0",
    "networkx>=3.2.1",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
