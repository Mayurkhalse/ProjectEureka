name: Project EUREKA CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Backend Test Suite
    runs-on: ubuntu-latest

    # 1. ADD THE SERVICE CONTAINER
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: eureka_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d eureka_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # 2. SET THE DATABASE URL FOR THE TEST SUITE
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/eureka_db
      PYTHONPATH: backend/src:src

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v2
        with:
          enable-cache: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          uv venv
          uv pip install --upgrade pip setuptools wheel
          uv pip install torch -f https://download.pytorch.org/whl/cpu/torch_stable.html
          uv pip install --no-build-isolation -r backend/requirements.txt python-dotenv psutil pytest pytest-asyncio httpx psycopg[binary]

      - name: Wait for Postgres and Initialize Schema
        run: |
          sudo apt-get update -y
          sudo apt-get install -y postgresql-client
          
          echo "Waiting for PostgreSQL to be ready..."
          for i in {1..30}; do
            if pg_isready -h 127.0.0.1 -p 5432 -U postgres -d eureka_db; then
              echo "PostgreSQL is ready!"
              break
            fi
            sleep 1
          done
          
          # FIXED: Complete, un-truncated database initialization command
          uv run python -c "from sqlalchemy import create_engine; from eureka.db.models import Base; engine = create_engine('postgresql://postgres:postgres@127.0.0.1:5432/eureka_db'); Base.metadata.create_all(bind=engine)"

      - name: Run EUREKA Test Suite
        run: uv run pytest backend/tests/test_api_endpoints.py -v
