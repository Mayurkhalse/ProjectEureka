name: Project EUREKA CI

on:
  push:
    branches: [ main, develop, test/backend-testing, "test/**", "feature/**" ]
  pull_request:
    branches: [ main, develop, test/backend-testing ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Backend Comprehensive Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: eureka_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d eureka_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/eureka_db
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_DB: eureka_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/0
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/1
      CELERY_TASK_ALWAYS_EAGER: "true"
      PYTHONPATH: backend/src:src

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v2
        with:
          enable-cache: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          uv venv
          uv pip install --upgrade pip setuptools wheel
          uv pip install torch -f https://download.pytorch.org/whl/cpu/torch_stable.html
          uv pip install --no-build-isolation -r backend/requirements.txt python-dotenv psutil pytest pytest-asyncio httpx psycopg[binary]

      - name: Wait for Postgres and Initialize Schema
        run: |
          sudo apt-get update -y
          sudo apt-get install -y postgresql-client
          
          echo "Waiting for PostgreSQL to be ready..."
          for i in {1..30}; do
            if pg_isready -h 127.0.0.1 -p 5432 -U postgres -d eureka_db; then
              echo "PostgreSQL is ready!"
              break
            fi
            sleep 1
          done
          
          # Initialize all 36 tables across ORM and DB models
          uv run python -c "
          from sqlalchemy import create_engine
          from eureka.models.orm import Base as OrmBase
          from eureka.db.models import Base as DbBase
          engine = create_engine('postgresql://postgres:postgres@127.0.0.1:5432/eureka_db')
          OrmBase.metadata.create_all(bind=engine)
          DbBase.metadata.create_all(bind=engine)
          print('All relational tables created successfully!')
          "

      - name: Run Comprehensive Backend Test Suite
        run: uv run pytest backend/tests/ -v --durations=10
