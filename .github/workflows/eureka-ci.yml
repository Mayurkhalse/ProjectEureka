name: Project EUREKA CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Backend Test Suite (38 Tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v2
        with:
          enable-cache: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          uv venv
          # Ensure pip is up-to-date in the uv venv
          uv pip install --upgrade pip setuptools wheel

          # Install PyTorch into the same uv venv first so torch is importable during builds
          uv pip install torch -f https://download.pytorch.org/whl/cpu/torch_stable.html

          # Now install the remaining requirements and test tools
          if [ -f "backend/requirements.txt" ]; then
            uv pip install --no-build-isolation -r backend/requirements.txt pytest pytest-asyncio httpx
          elif [ -f "project-eureka/requirements.txt" ]; then
            uv pip install --no-build-isolation -r project-eureka/requirements.txt pytest pytest-asyncio httpx
          elif [ -f "requirements.txt" ]; then
            uv pip install --no-build-isolation -r requirements.txt pytest pytest-asyncio httpx
          fi

      - name: Run EUREKA 38-Test Suite
        run: |
          if [ -d "backend/tests" ]; then
            uv run pytest backend/tests/ -v
          elif [ -d "project-eureka/tests" ]; then
            uv run pytest project-eureka/tests/ -v
          else
            uv run pytest tests/ -v
          fi
