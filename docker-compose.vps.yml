version: "3.8"

services:
  # ----------------------------------------------------
  # 1. PostgreSQL 16 Master (CQRS Read/Write Store)
  # ----------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: savi-postgres-master
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-savi_master}
      POSTGRES_USER: ${POSTGRES_USER:-savi_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-savi_secret}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - savi_pg_data:/var/lib/postgresql/data
      - ./docker/init_postgres.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-savi_user} -d ${POSTGRES_DB:-savi_master}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - savi_net

  # ----------------------------------------------------
  # 2. Neo4j 5.x Graph Database (Topological Compute)
  # ----------------------------------------------------
  neo4j:
    image: neo4j:5.18-community
    container_name: savi-neo4j-compute
    restart: always
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-savi_graph_secret}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 2G
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - savi_neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_PASSWORD:-savi_graph_secret} 'RETURN 1'"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - savi_net

  # ----------------------------------------------------
  # 3. SAVI Analytics & Serving API (FastAPI)
  # ----------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: savi-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # In-network container host overrides
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-savi_master}
      POSTGRES_USER: ${POSTGRES_USER:-savi_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-savi_secret}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-savi_graph_secret}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - savi_net

  # ----------------------------------------------------
  # 4. Nginx Reverse Proxy (SSL & Extension CORS)
  # ----------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: savi-nginx
    restart: always
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/savi-vps.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certbot/conf:/etc/letsencrypt:ro
      - ./deploy/certbot/www:/var/www/certbot:ro
    networks:
      - savi_net

networks:
  savi_net:
    driver: bridge

volumes:
  savi_pg_data:
    driver: local
  savi_neo4j_data:
    driver: local
