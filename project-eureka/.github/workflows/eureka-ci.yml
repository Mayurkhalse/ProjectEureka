name: Project EUREKA CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Backend Test Suite (38 Tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v2
        with:
          enable-cache: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          uv venv
          if [ -f "project-eureka/requirements.txt" ]; then
            uv pip install -r project-eureka/requirements.txt pytest pytest-asyncio
          else
            uv pip install -r requirements.txt pytest pytest-asyncio
          fi

      - name: Run EUREKA 38-Test Suite
        run: |
          if [ -d "project-eureka/tests" ]; then
            uv run pytest project-eureka/tests/ -v
          else
            uv run pytest tests/ -v
          fi
