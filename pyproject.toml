[project]
name = "savi"
version = "0.1.0"
description = "SAVI (Sentiment, Accuracy, Validation, Impact) Intelligence Platform"
readme = "README.md"
authors = [
    { name = "himanshu-anonymous", email = "himanshupatilpianist@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "httpx>=0.27.0",
    "networkx>=3.2",
    "numpy>=1.26.0",
    "pydantic>=2.6.0",
    "scipy>=1.12.0",
    "uvicorn>=0.29.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
db = [
    "asyncpg>=0.29.0",
    "neo4j>=5.18.0",
    "psycopg2-binary>=2.9.9",
    "sqlalchemy>=2.0.28",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"
